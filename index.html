<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>commonplace</title>
<link rel="stylesheet" href="settings.css">
<script>
  try { if (localStorage.getItem('cp-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
<style>
  html, body { margin: 0; background: var(--background); }
  body {
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 20px 0 120px;
  }
  header {
    display: flex; justify-content: center; gap: 14px;
    font-size: var(--label-size); line-height: 16px; letter-spacing: 0.02em;
  }
  header .count { color: var(--muted); }
  main {
    max-width: var(--page-width);
    margin: 72px auto 0;
    padding: 0 clamp(16px, 4vw, 48px);
    display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: center;
    column-gap: var(--gap); row-gap: var(--row-gap);
  }
  /* keeps a short last row packed to the left instead of stretched */
  main::after { content: ""; flex: 1 1 auto; }

  .item { display: block; max-width: 100%; }
  img.item, video.item { width: auto; object-fit: cover; }
  .s1 { height: calc(130px * var(--image-scale)); }
  .s2 { height: calc(155px * var(--image-scale)); }
  .s3 { height: calc(175px * var(--image-scale)); }
  .s4 { height: calc(200px * var(--image-scale)); }
  .s5 { height: calc(235px * var(--image-scale)); }
  img.item, video.item { max-height: 70vh; }

  .scrap { display: flex; flex-direction: column; gap: 8px; }
  .scrap p {
    margin: 0; font-family: var(--scrap-font, var(--font));
    font-size: var(--scrap-size, var(--text-size)); line-height: var(--scrap-leading, 1.4);
    white-space: pre-line; text-wrap: pretty; overflow-wrap: anywhere;
  }
  .scrap .note { font-size: var(--label-size); line-height: 15px; color: var(--muted); }
  .w1 { width: calc(190px * var(--image-scale) + 40px); }
  .w2 { width: calc(220px * var(--image-scale) + 40px); }
  .w3 { width: calc(260px * var(--image-scale) + 40px); }

  .empty { color: var(--muted); font-size: var(--label-size); margin: 0 auto; }

  /* click to view large */
  img.item, video.item { cursor: default; }
  img.item:focus-visible, video.item:focus-visible { outline: 1px solid var(--muted); outline-offset: 4px; }
  #viewer {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 4vw; box-sizing: border-box;
    /* the page shows through, softly blurred */
    background: color-mix(in srgb, var(--viewer-color, var(--background)) var(--viewer-tint, 45%), transparent);
    -webkit-backdrop-filter: blur(var(--viewer-blur, 18px));
    backdrop-filter: blur(var(--viewer-blur, 18px));
    cursor: default;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease;
  }
  #viewer.open { opacity: 1; pointer-events: auto; }
  #viewer img, #viewer video {
    /* how big an opened image gets, as a share of the window */
    max-width: var(--viewer-width, 62vw); max-height: var(--viewer-height, 72vh);
    width: auto; height: auto; display: block;
    object-fit: contain;
  }
  @media (max-width: 640px) {
    #viewer img, #viewer video { max-width: 92vw; }
  }
  /* light / dark toggle (top right) */
  :root[data-theme="dark"] {
    --background: var(--dark-background, #0e0e0e);
    --text: var(--dark-text, #ececec);
    --muted: var(--dark-muted, #9a9a9a);
  }
  html, body { transition: background-color 200ms ease, color 200ms ease; }
  .theme-toggle {
    position: fixed; top: 13px; right: clamp(10px, 4vw, 42px); z-index: 5;
    display: block; width: 30px; height: 30px; padding: 6px; box-sizing: border-box;
    color: var(--text); background: none; border: 0; cursor: pointer;
  }
  .theme-toggle svg { display: block; transition: transform 300ms ease; }
  :root[data-theme="dark"] .theme-toggle svg { transform: rotate(22.5deg); }
  .theme-toggle:hover svg { transform: rotate(45deg); }
  :root[data-theme="dark"] .theme-toggle:hover svg { transform: rotate(67.5deg); }
  .theme-toggle:focus-visible { outline: 1px solid var(--muted); outline-offset: 2px; }
  body.viewing .theme-toggle { visibility: hidden; }

  body.viewing { overflow: hidden; }

  /* header link */
  header .info-link {
    font: inherit; color: var(--muted); background: none; border: 0; padding: 0;
    cursor: pointer; letter-spacing: inherit;
  }
  header .info-link:hover { color: var(--text); }

  /* information panel */
  #info {
    position: fixed; inset: 0; z-index: 11;
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 4vw; box-sizing: border-box;
    background: color-mix(in srgb, var(--background) 55%, transparent);
    -webkit-backdrop-filter: blur(var(--about-blur, 22px));
    backdrop-filter: blur(var(--about-blur, 22px));
    opacity: 0; pointer-events: none; transition: opacity 160ms ease;
  }
  #info.open { opacity: 1; pointer-events: auto; }
  /* about: plain text on the blurred page (default), or a small flat panel docked bottom-right */
  #info { align-items: flex-start; }
  #info .about {
    position: relative; width: min(1100px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box;
    margin-top: 9vh; color: var(--text);
    display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); column-gap: clamp(28px, 6vw, 96px);
    font-size: var(--about-size, 20px); line-height: 1.3;
  }
  #info .about h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
  #info .main p, #info .side p { margin: 0 0 1em; white-space: pre-line; }
  #info .main p:last-child, #info .side p:last-child { margin-bottom: 0; }
  #info a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  #info .x {
    display: none; font: inherit; color: inherit; background: none; border: 0; padding: 0 2px; cursor: pointer; line-height: 1;
  }
  /* no visible close: click anywhere or press Esc. Keyboard users still get it on Tab. */
  #info .close {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
    font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  }
  #info .close:focus-visible {
    width: auto; height: auto; clip: auto; overflow: visible; top: 0; right: 0;
    outline: 1px solid currentColor; outline-offset: 4px;
  }
  #info .about:focus { outline: none; }

  /* docked panel variant: settings.css  --about-style: panel; */
  #info.panel { align-items: flex-end; justify-content: flex-end; padding: 0; }
  #info.panel .about {
    width: min(460px, 100vw); margin: 0; max-height: 80vh;
    display: block; padding: 14px 18px 18px;
    background: var(--panel-background, #b3b3b3); color: var(--panel-text, #111111);
    font-size: var(--label-size); line-height: 1.45;
  }
  :root[data-theme="dark"] #info.panel .about { background: var(--dark-panel-background, #2a2a2a); color: var(--dark-panel-text, #ececec); }
  #info.panel .about h2 {
    position: static; width: auto; height: auto; clip: auto; overflow: visible;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: inherit; font-weight: normal; margin: 0 0 14px;
  }
  #info.panel .x { display: inline; }
  #info.panel .main { margin-bottom: 16px; }
  #info.panel .close { display: none; }


  /* sheet variant: settings.css  --about-style: sheet;  (flat sheet docked top-left, no blur) */
  #info.sheet {
    align-items: flex-start; justify-content: flex-start; padding: 0;
    background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  #info.sheet .about {
    width: min(620px, 100vw); margin: 0; max-height: 100vh; display: block;
    padding: 18px 20px 22px;
    background: var(--sheet-background, #ffffff); color: var(--sheet-text, #111111);
    font-size: var(--sheet-size, 15px); line-height: 1.4;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  }
  :root[data-theme="dark"] #info.sheet .about {
    background: var(--dark-sheet-background, #000000); color: var(--dark-sheet-text, #ececec);
    box-shadow: 0 0 0 1px rgba(255,255,255,.12);
  }
  #info.sheet .about h2 {
    position: static; width: auto; height: auto; clip: auto; overflow: visible;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    font-size: inherit; font-weight: 600; margin: 0 0 16px;
  }
  #info.sheet .x { display: inline; font-weight: 600; }
  #info.sheet .x::before { content: "(close)"; }
  #info.sheet .x { font-size: 0; }
  #info.sheet .x::before { font-size: var(--sheet-size, 15px); }
  #info.sheet .x:hover { text-decoration: underline; text-underline-offset: 3px; }
  #info.sheet .main { margin-bottom: 18px; }
  #info.sheet .side p { margin: 0; }
  #info.sheet .close { display: none; }
  @media (max-width: 760px) {
    #info .about { grid-template-columns: 1fr; row-gap: 1em; margin-top: 4vh; font-size: var(--about-size-phone, 17px); }
    #info.panel .about { width: 100vw; }
  }

  /* one size · one margin · pinned sentence header */
  body { padding: 0 0 120px; font-size: var(--size, 16px); line-height: var(--leading, 1.3); }

  header {
    position: fixed; top: var(--m, 18px); left: var(--m, 18px); right: calc(var(--m, 18px) * 3); z-index: 6;
    display: block; max-width: 34em;
    font-size: var(--size, 16px); line-height: var(--leading, 1.3); letter-spacing: 0;
    color: #fff; mix-blend-mode: difference; pointer-events: none;
  }
  header .name { display: none; }
  header .sentence { pointer-events: auto; }
  header .info-link {
    font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
  }
  header .info-link:hover { color: inherit; text-decoration-thickness: 2px; }
  header .ago { font-style: italic; }

  .theme-toggle { top: calc(var(--m, 18px) - 6px); right: calc(var(--m, 18px) - 6px); color: #fff; mix-blend-mode: difference; }

  main {
    max-width: none; margin: calc(var(--m, 18px) * 7) 0 0; padding: 0 var(--m, 18px);
  }
  .scrap p { font-size: var(--size, 16px); line-height: var(--leading, 1.3); }
  .scrap .note { font-size: var(--size, 16px); line-height: var(--leading, 1.3); font-style: italic; color: var(--muted); }
  .scrap { gap: 0; }

  #info { padding: 0; }
  #info .about {
    margin: 0; padding: calc(var(--m, 18px) * 5) var(--m, 18px) var(--m, 18px); width: 100%; max-width: none;
    font-size: var(--size, 16px); line-height: var(--leading, 1.3);
    grid-template-columns: minmax(0, 34em) minmax(0, 1fr); column-gap: calc(var(--m, 18px) * 3);
  }
  #info .main p, #info .side p { margin-bottom: calc(var(--leading, 1.3) * 1em); }
  @media (max-width: 760px) {
    :where(:root) { --size: 15px; --m: 14px; }
    #info .about { grid-template-columns: 1fr; font-size: var(--size, 16px); padding-top: calc(var(--m, 18px) * 7); }
    main { margin-top: calc(var(--m, 18px) * 9); }
    header { right: 54px; }
  }

  /* the link in the header sentence: a 'selected' highlight */
          header .info-link {
    text-decoration: none; background: #fff; color: #000; padding: 0 .22em; margin: 0 -.06em; border-radius: 2px;
  }
  header .info-link:hover { padding: 0 .3em; margin: 0 -.14em; }
</style>
</head>
<body>
<header>
  <span class="name"></span>
  <span class="sentence"><span class="site"></span> is <button class="info-link" type="button" aria-haspopup="dialog">a folder on my desktop</button>, <span class="ago">last updated —</span>.</span>
</header>
<button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark background">
  <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
    <g stroke="currentColor" stroke-width="3.2" stroke-linecap="butt">
      <line x1="10" y1="1" x2="10" y2="19"/>
      <line x1="1" y1="10" x2="19" y2="10"/>
      <line x1="3.64" y1="3.64" x2="16.36" y2="16.36"/>
      <line x1="16.36" y1="3.64" x2="3.64" y2="16.36"/>
    </g>
  </svg>
</button>
<main id="grid" aria-live="polite"></main>
<div id="info" role="dialog" aria-modal="true" aria-labelledby="info-label" aria-hidden="true">
  <div class="about">
    <h2 id="info-label"><span>about</span><button class="x" type="button" aria-label="Close">×</button></h2>
    <div class="main"></div>
    <div class="side"></div>
    <button class="close" type="button">close</button>
  </div>
</div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Enlarged view" aria-hidden="true"></div>

<script>
(function () {
  var root = getComputedStyle(document.documentElement);
  var name = (root.getPropertyValue('--site-name') || 'commonplace').trim().replace(/^["']|["']$/g, '');
  document.title = name;
  document.querySelector('header .name').textContent = name;
  document.querySelector('header .site').textContent = name;

  // same item always gets the same size
  function pick(id, n) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return (h % n) + 1;
  }

  function el(tag, attrs) {
    var e = document.createElement(tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    return e;
  }

  function ago(iso) {
    var t = Date.parse(iso); if (isNaN(t)) return '';
    var s = Math.max(0, (Date.now() - t) / 1000), m = s / 60, h = m / 60, d = h / 24;
    if (m < 2) return 'just now';
    if (m < 60) return Math.round(m) + ' minutes ago';
    if (h < 1.5) return 'an hour ago';
    if (h < 24) return Math.round(h) + ' hours ago';
    if (d < 1.5) return 'yesterday';
    if (d < 30) return Math.round(d) + ' days ago';
    return new Date(t).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  }
  function render(items) {
    var newest = items.reduce(function (a, it) { return it.added && it.added > a ? it.added : a; }, '');
    document.querySelector('header .ago').textContent = newest ? 'last updated ' + ago(newest) : 'just started';
    var grid = document.getElementById('grid');
    if (!items.length) {
      var p = el('p', { class: 'empty' });
      p.textContent = 'Nothing here yet.';
      grid.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var node;
      if (it.type === 'image') {
        node = el('img', {
          src: it.src, alt: '', loading: 'lazy', decoding: 'async',
          width: it.w, height: it.h,
          class: 'item s' + pick(it.id, 5)
        });
      } else if (it.type === 'video') {
        node = el('video', {
          src: it.src, autoplay: '', muted: '', loop: '', playsinline: '',
          preload: 'metadata', class: 'item s' + pick(it.id, 5)
        });
        node.muted = true;
      } else if (it.type === 'text') {
        var len = (it.text || '').length;
        node = el('div', { class: 'item scrap ' + (len < 50 ? 'w1' : len < 130 ? 'w2' : 'w3') });
        var p = el('p');
        p.textContent = it.text;
        node.appendChild(p);
        if (it.note) {
          var n = el('span', { class: 'note' });
          n.textContent = it.note;
          node.appendChild(n);
        }
      }
      if (node) {
        if (it.type === 'image' || it.type === 'video') {
          node.tabIndex = 0;
          node.addEventListener('click', function () { open(it, node); });
          node.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(it, node); }
          });
        }
        grid.appendChild(node);
      }
    });
  }

  // ── tint the blurred background with the clicked image's main color ──
  // settings.css: --viewer-match: on | off (default off: plain blur, or --viewer-color if set)
  function matchOn() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--viewer-match');
    return (v || 'off').trim().replace(/["']/g, '') === 'on';
  }
  var colorCache = {};
  function mainColor(source, key) {
    if (colorCache[key] !== undefined) return colorCache[key];
    var w = source.naturalWidth || source.videoWidth, h = source.naturalHeight || source.videoHeight;
    if (!w || !h) return null;
    try {
      var c = document.createElement('canvas');
      c.width = 40; c.height = 40;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(source, 0, 0, 40, 40);
      var d = ctx.getImageData(0, 0, 40, 40).data;
      // vote by hue, weighted toward colorful pixels; greys barely count
      var bins = new Array(24).fill(0), sumS = new Array(24).fill(0), total = 0, colorful = 0;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, ch = max - min;
        total++;
        if (ch < 0.08 || l < 0.08 || l > 0.96) continue;
        var s = ch / (1 - Math.abs(2 * l - 1));
        var hh = max === r ? ((g - b) / ch) % 6 : max === g ? (b - r) / ch + 2 : (r - g) / ch + 4;
        var hue = (hh * 60 + 360) % 360, bin = Math.floor(hue / 15) % 24;
        bins[bin] += ch * ch; sumS[bin] += s; colorful++;
      }
      if (colorful < total * 0.06) { colorCache[key] = null; return null; } // basically grey
      var best = 0;
      for (var k = 1; k < 24; k++) if (bins[k] > bins[best]) best = k;
      var hue2 = best * 15 + 7.5;
      var sat = Math.min(90, Math.max(45, (sumS[best] / Math.max(1, colorful)) * 100 + 35));
      colorCache[key] = 'hsl(' + hue2 + ' ' + sat + '% 76%)';   // kept light, like a wash
      return colorCache[key];
    } catch (e) { colorCache[key] = null; return null; }
  }

  // ── click to view large; click anywhere or press Esc to close ──
  var viewer = document.getElementById('viewer');
  var lastFocus = null;
  function open(it, source) {
    lastFocus = document.activeElement;
    viewer.innerHTML = '';
    var big;
    if (it.type === 'video') {
      big = el('video', { src: it.src, autoplay: '', loop: '', playsinline: '' });
      big.muted = true;
    } else {
      big = el('img', { src: it.src, alt: '' });
    }
    viewer.appendChild(big);
    var tint = matchOn() && source ? mainColor(source, it.id) : null;
    if (tint) viewer.style.setProperty('--viewer-color', tint);
    else viewer.style.removeProperty('--viewer-color');
    viewer.setAttribute('aria-hidden', 'false');
    viewer.classList.add('open');
    document.body.classList.add('viewing');
    viewer.tabIndex = -1;
    viewer.focus();
  }
  function close() {
    if (!viewer.classList.contains('open')) return;
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('viewing');
    setTimeout(function () { if (!viewer.classList.contains('open')) viewer.innerHTML = ''; }, 200);
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  viewer.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { close(); closeInfo(); } });

  // ── light / dark toggle ──
  var themeBtn = document.querySelector('.theme-toggle');
  function syncTheme() {
    var dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light background' : 'Switch to dark background');
  }
  themeBtn.addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme !== 'dark';
    if (dark) document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('cp-theme', dark ? 'dark' : 'light'); } catch (e) {}
    syncTheme();
  });
  syncTheme();

  // ── information panel: text comes from info.txt ──
  // info.txt: paragraphs separated by blank lines; a line of --- splits
  // the middle column (above) from the right-hand column (below). Links auto-link.
  var info = document.getElementById('info');
  var infoBtn = document.querySelector('header .info-link');
  var LINK_RE = /(https?:\/\/[^\s]+|[\w.+-]+@[\w-]+\.[\w.-]+|(?:[\w-]+\.)+(?:com|org|net|io|na|world|xyz|art|studio|design|co|me|site|page)(?:\/[^\s]*)?)/g;
  function href(t) {
    if (t.indexOf('@') > 0 && t.indexOf('/') < 0) return 'mailto:' + t;
    return /^https?:/.test(t) ? t : 'https://' + t;
  }
  function link(text, url) {
    var a = document.createElement('a');
    a.textContent = text;
    a.href = href(url);
    if (!/^mailto:/.test(a.href)) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }
  function addLine(p, line) {
    // "portfolio: https://example.com"  →  a link that reads "portfolio"
    var lab = line.match(/^\s*([^:\n]{1,40}?)\s*:\s+(\S+)\s*$/);
    if (lab && lab[2].match(LINK_RE) && lab[2].match(LINK_RE)[0] === lab[2].replace(/[.,;)]+$/, '')) {
      p.appendChild(link(lab[1], lab[2].replace(/[.,;)]+$/, '')));
      return;
    }
    var last = 0, m;
    LINK_RE.lastIndex = 0;
    while ((m = LINK_RE.exec(line))) {
      var t = m[0].replace(/[.,;:)]+$/, '');
      p.appendChild(document.createTextNode(line.slice(last, m.index)));
      p.appendChild(link(t, t));
      last = m.index + t.length;
      LINK_RE.lastIndex = last;
    }
    p.appendChild(document.createTextNode(line.slice(last)));
  }
  function addParas(box, text) {
    text.split(/\n\s*\n/).forEach(function (para) {
      para = para.replace(/^\s+|\s+$/g, '');
      if (!para) return;
      var p = document.createElement('p');
      para.split('\n').forEach(function (line, i) {
        if (i) p.appendChild(document.createTextNode('\n'));
        addLine(p, line);
      });
      box.appendChild(p);
    });
  }
  fetch('info.txt?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .catch(function () { return ''; })
    .then(function (txt) {
      txt = (txt || '').replace(/\r\n?/g, '\n').trim();
      if (!txt) return;                       // no info.txt → no link
      var parts = txt.split(/\n\s*-{3,}\s*\n/);
      addParas(info.querySelector('.main'), parts[0] || '');
      addParas(info.querySelector('.side'), parts.slice(1).join('\n\n'));
      infoBtn.hidden = false;
    });
  var infoReturn = null;
  function openInfo() {
    infoReturn = document.activeElement;
    info.classList.add('open');
    info.setAttribute('aria-hidden', 'false');
    document.body.classList.add('viewing');
    var box = info.querySelector('.about'); box.tabIndex = -1; box.focus({ preventScroll: true });
  }
  function closeInfo() {
    if (!info.classList.contains('open')) return;
    info.classList.remove('open');
    info.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('viewing');
    if (infoReturn) infoReturn.focus({ preventScroll: true });
  }
  function aboutStyle() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--about-style');
    return (v || 'text').trim().replace(/["']/g, '');
  }
  infoBtn.addEventListener('click', function () {
    info.classList.toggle('panel', aboutStyle() === 'panel');
    info.classList.toggle('sheet', aboutStyle() === 'sheet');
    openInfo();
  });
  info.querySelector('.x').addEventListener('click', closeInfo);
  info.querySelector('.close').addEventListener('click', closeInfo);
  info.addEventListener('click', function (e) {
    if (e.target.closest('a, button')) return;
    if ((info.classList.contains('panel') || info.classList.contains('sheet')) && e.target.closest('.about')) return;
    closeInfo();
  });

  fetch('items.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .catch(function () { return []; })
    .then(render);
})();
</script>
</body>
</html>
