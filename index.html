<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>commonplace</title>
<link rel="stylesheet" href="settings.css">
<style>
  html, body { margin: 0; background: var(--background); }
  body {
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 20px 0 120px;
  }
  header {
    display: flex; justify-content: center; gap: 14px;
    font-size: var(--label-size); line-height: 16px; letter-spacing: 0.02em;
  }
  header .count { color: var(--muted); }
  main {
    max-width: var(--page-width);
    margin: 72px auto 0;
    padding: 0 clamp(16px, 4vw, 48px);
    display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: center;
    column-gap: var(--gap); row-gap: var(--row-gap);
  }
  /* keeps a short last row packed to the left instead of stretched */
  main::after { content: ""; flex: 1 1 auto; }

  .item { display: block; max-width: 100%; }
  img.item, video.item { width: auto; object-fit: cover; }
  .s1 { height: calc(130px * var(--image-scale)); }
  .s2 { height: calc(155px * var(--image-scale)); }
  .s3 { height: calc(175px * var(--image-scale)); }
  .s4 { height: calc(200px * var(--image-scale)); }
  .s5 { height: calc(235px * var(--image-scale)); }
  img.item, video.item { max-height: 70vh; }

  .scrap { display: flex; flex-direction: column; gap: 8px; }
  .scrap p {
    margin: 0; font-size: var(--text-size); line-height: 1.4;
    white-space: pre-line; text-wrap: pretty; overflow-wrap: anywhere;
  }
  .scrap .note { font-size: var(--label-size); line-height: 15px; color: var(--muted); }
  .w1 { width: calc(190px * var(--image-scale) + 40px); }
  .w2 { width: calc(220px * var(--image-scale) + 40px); }
  .w3 { width: calc(260px * var(--image-scale) + 40px); }

  .empty { color: var(--muted); font-size: var(--label-size); margin: 0 auto; }

  /* click to view large */
  img.item, video.item { cursor: default; }
  img.item:focus-visible, video.item:focus-visible { outline: 1px solid var(--muted); outline-offset: 4px; }
  #viewer {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 4vh 4vw; box-sizing: border-box;
    /* the page shows through, softly blurred */
    background: color-mix(in srgb, var(--viewer-color, var(--background)) var(--viewer-tint, 45%), transparent);
    -webkit-backdrop-filter: blur(var(--viewer-blur, 18px));
    backdrop-filter: blur(var(--viewer-blur, 18px));
    cursor: default;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease;
  }
  #viewer.open { opacity: 1; pointer-events: auto; }
  #viewer img, #viewer video {
    /* how big an opened image gets, as a share of the window */
    max-width: var(--viewer-width, 62vw); max-height: var(--viewer-height, 72vh);
    width: auto; height: auto; display: block;
    object-fit: contain;
  }
  @media (max-width: 640px) {
    #viewer img, #viewer video { max-width: 92vw; }
  }
  body.viewing { overflow: hidden; }
</style>
</head>
<body>
<header>
  <span class="name"></span>
  <span class="count"></span>
</header>
<main id="grid" aria-live="polite"></main>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Enlarged view" aria-hidden="true"></div>

<script>
(function () {
  var root = getComputedStyle(document.documentElement);
  var name = (root.getPropertyValue('--site-name') || 'commonplace').trim().replace(/^["']|["']$/g, '');
  document.title = name;
  document.querySelector('header .name').textContent = name;

  // same item always gets the same size
  function pick(id, n) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return (h % n) + 1;
  }

  function el(tag, attrs) {
    var e = document.createElement(tag);
    for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    return e;
  }

  function render(items) {
    var grid = document.getElementById('grid');
    var count = document.querySelector('header .count');
    count.textContent = 'library (' + items.length + ')';
    if (!items.length) {
      var p = el('p', { class: 'empty' });
      p.textContent = 'Nothing here yet.';
      grid.appendChild(p);
      return;
    }
    items.forEach(function (it) {
      var node;
      if (it.type === 'image') {
        node = el('img', {
          src: it.src, alt: '', loading: 'lazy', decoding: 'async',
          width: it.w, height: it.h,
          class: 'item s' + pick(it.id, 5)
        });
      } else if (it.type === 'video') {
        node = el('video', {
          src: it.src, autoplay: '', muted: '', loop: '', playsinline: '',
          preload: 'metadata', class: 'item s' + pick(it.id, 5)
        });
        node.muted = true;
      } else if (it.type === 'text') {
        var len = (it.text || '').length;
        node = el('div', { class: 'item scrap ' + (len < 50 ? 'w1' : len < 130 ? 'w2' : 'w3') });
        var p = el('p');
        p.textContent = it.text;
        node.appendChild(p);
        if (it.note) {
          var n = el('span', { class: 'note' });
          n.textContent = it.note;
          node.appendChild(n);
        }
      }
      if (node) {
        if (it.type === 'image' || it.type === 'video') {
          node.tabIndex = 0;
          node.addEventListener('click', function () { open(it, node); });
          node.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(it, node); }
          });
        }
        grid.appendChild(node);
      }
    });
  }

  // ── tint the blurred background with the clicked image's main color ──
  // settings.css: --viewer-match: on | off   (off = use --viewer-color / background)
  function matchOn() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--viewer-match');
    return (v || 'on').trim().replace(/["']/g, '') !== 'off';
  }
  var colorCache = {};
  function mainColor(source, key) {
    if (colorCache[key] !== undefined) return colorCache[key];
    var w = source.naturalWidth || source.videoWidth, h = source.naturalHeight || source.videoHeight;
    if (!w || !h) return null;
    try {
      var c = document.createElement('canvas');
      c.width = 40; c.height = 40;
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(source, 0, 0, 40, 40);
      var d = ctx.getImageData(0, 0, 40, 40).data;
      // vote by hue, weighted toward colorful pixels; greys barely count
      var bins = new Array(24).fill(0), sumS = new Array(24).fill(0), total = 0, colorful = 0;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, ch = max - min;
        total++;
        if (ch < 0.08 || l < 0.08 || l > 0.96) continue;
        var s = ch / (1 - Math.abs(2 * l - 1));
        var hh = max === r ? ((g - b) / ch) % 6 : max === g ? (b - r) / ch + 2 : (r - g) / ch + 4;
        var hue = (hh * 60 + 360) % 360, bin = Math.floor(hue / 15) % 24;
        bins[bin] += ch * ch; sumS[bin] += s; colorful++;
      }
      if (colorful < total * 0.06) { colorCache[key] = null; return null; } // basically grey
      var best = 0;
      for (var k = 1; k < 24; k++) if (bins[k] > bins[best]) best = k;
      var hue2 = best * 15 + 7.5;
      var sat = Math.min(90, Math.max(45, (sumS[best] / Math.max(1, colorful)) * 100 + 35));
      colorCache[key] = 'hsl(' + hue2 + ' ' + sat + '% 76%)';   // kept light, like a wash
      return colorCache[key];
    } catch (e) { colorCache[key] = null; return null; }
  }

  // ── click to view large; click anywhere or press Esc to close ──
  var viewer = document.getElementById('viewer');
  var lastFocus = null;
  function open(it, source) {
    lastFocus = document.activeElement;
    viewer.innerHTML = '';
    var big;
    if (it.type === 'video') {
      big = el('video', { src: it.src, autoplay: '', loop: '', playsinline: '' });
      big.muted = true;
    } else {
      big = el('img', { src: it.src, alt: '' });
    }
    viewer.appendChild(big);
    var tint = matchOn() && source ? mainColor(source, it.id) : null;
    if (tint) viewer.style.setProperty('--viewer-color', tint);
    else viewer.style.removeProperty('--viewer-color');
    viewer.setAttribute('aria-hidden', 'false');
    viewer.classList.add('open');
    document.body.classList.add('viewing');
    viewer.tabIndex = -1;
    viewer.focus();
  }
  function close() {
    if (!viewer.classList.contains('open')) return;
    viewer.classList.remove('open');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('viewing');
    setTimeout(function () { if (!viewer.classList.contains('open')) viewer.innerHTML = ''; }, 200);
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  viewer.addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  fetch('items.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : []; })
    .catch(function () { return []; })
    .then(render);
})();
</script>
</body>
</html>
